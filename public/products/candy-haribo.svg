<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="200" height="400">
  <defs>
    <linearGradient id="gummyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3498DB"/>
      <stop offset="50%" stop-color="#2980B9"/>
      <stop offset="100%" stop-color="#1B4F72"/>
    </linearGradient>
  </defs>
  <!-- Bag with transparent center window showing gummies -->
  <rect x="45" y="80" width="110" height="240" rx="14" fill="url(#gummyBg)"/>
  <line x1="45" y1="88" x2="155" y2="88" stroke="#F1C40F" stroke-width="4"/>
  <line x1="45" y1="312" x2="155" y2="312" stroke="#154360" stroke-width="4"/>
  <!-- Window -->
  <ellipse cx="100" cy="180" rx="35" ry="30" fill="#FFFFFF" opacity="0.2"/>
  <!-- Colorful gummy shapes -->
  <circle cx="85" cy="175" r="10" fill="#E74C3C"/>
  <circle cx="115" cy="170" r="10" fill="#2ECC71"/>
  <circle cx="100" cy="190" r="10" fill="#F1C40F"/>
  <circle cx="95" cy="165" r="8" fill="#E67E22"/>
  <text x="100" y="245" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="15" letter-spacing="1">BONBONS</text>
  <text x="100" y="265" text-anchor="middle" fill="#F9E79F" font-family="'Inter', sans-serif" font-weight="700" font-size="11">SOUR MIX</text>
  <text x="100" y="295" text-anchor="middle" fill="#FFFFFF" opacity="0.8" font-family="'Inter', sans-serif" font-weight="600" font-size="10">200G</text>
</svg>
