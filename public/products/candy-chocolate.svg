<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="200" height="400">
  <defs>
    <linearGradient id="chocWrapper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A235A"/>
      <stop offset="50%" stop-color="#6C3483"/>
      <stop offset="100%" stop-color="#5B2C6F"/>
    </linearGradient>
    <linearGradient id="foil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2F3F4"/>
      <stop offset="100%" stop-color="#BDC3C7"/>
    </linearGradient>
  </defs>
  <!-- Foil top exposed -->
  <rect x="55" y="80" width="90" height="40" rx="4" fill="url(#foil)"/>
  <!-- Chocolate bar body wrapper -->
  <rect x="50" y="110" width="100" height="210" rx="8" fill="url(#chocWrapper)"/>
  <!-- Gold seal strip -->
  <rect x="50" y="160" width="100" height="12" fill="#F1C40F"/>
  <!-- Brand text -->
  <text x="100" y="210" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="14" letter-spacing="1">CHOCOLAT</text>
  <text x="100" y="230" text-anchor="middle" fill="#F9E79F" font-family="'Inter', sans-serif" font-weight="700" font-size="11">LAIT &amp; NOISETTES</text>
  <text x="100" y="270" text-anchor="middle" fill="#FFFFFF" opacity="0.8" font-family="'Inter', sans-serif" font-weight="600" font-size="10">100G</text>
</svg>
